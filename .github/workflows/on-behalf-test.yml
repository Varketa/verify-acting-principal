name: on-behalf-test
on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # on-behalf-release.yml runs these on the tagged commit before it builds
permissions:
  contents: read
jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18"
      - run: npm ci --ignore-scripts
        working-directory: on-behalf/js
      - run: npm run check
        working-directory: on-behalf/js
      - run: npm test
        working-directory: on-behalf/js
  # The release's dry run: the preflight and the same build on-behalf-release.yml runs, publishing nothing.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18"
      - run: bash on-behalf/release/preflight.sh
      - run: bash on-behalf/release/build.sh "$RUNNER_TEMP/release"
