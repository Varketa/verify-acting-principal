[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "varketa-verify-acting-principal"
version = "0.2.1"
description = "Verify the Varketa-Acting-Principal header (claim set versions 3 and 4) on an API that Varketa's agents call."
license = "MIT"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[tool.setuptools.packages.find]
where = ["src"]
